<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .wave-line {
      stroke-dasharray: 10, 10;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic / Animated Background Wave & Nodes (Strictly in Background) -->
  <g opacity="0.25">
    <path d="M 0 220 Q 300 120 600 220 T 1200 220 L 1200 320 L 0 320 Z" fill="url(#glow-grad)"/>
    <path d="M 0 180 Q 300 260 600 180 T 1200 180" fill="none" stroke="url(#accent-grad)" stroke-width="2" class="wave-line"/>
    <path d="M 0 240 Q 400 140 800 240 T 1200 200" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Background Data Nodes -->
  <g opacity="0.3">
    <circle cx="150" cy="80" r="4" fill="#38bdf8"/>
    <circle cx="280" cy="240" r="6" fill="#818cf8"/>
    <circle cx="1020" cy="100" r="5" fill="#c084fc"/>
    <circle cx="940" cy="250" r="4" fill="#38bdf8"/>
    <line x1="150" y1="80" x2="280" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="940" y1="250" x2="1020" y2="100" stroke="#c084fc" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Foreground Content Layer -->
  <g transform="translate(60, 70)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 0)">
      <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="18" y="21" class="badge-text">DATA PROTECTION &amp; DR</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" class="title">Awesome Cloud Backup &amp; Disaster Recovery</text>

    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">Curated SaaS Platforms &amp; Open-Source Projects for Enterprise Data Resilience</text>
  </g>

  <!-- Decorative Accent Bar at Bottom -->
  <rect x="0" y="312" width="1200" height="8" rx="4" fill="url(#accent-grad)"/>
</svg>
